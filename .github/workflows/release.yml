name: Build & Release Desktop Packages (DMG / DEB / EXE)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional tag name to create/update a GitHub Release (e.g. v1.0.0). Leave empty to only build artifacts.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 0. Static Analysis & Unit/Widget Tests
  # ---------------------------------------------------------------------------
  verify:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies & run checks
        run: |
          flutter pub get
          flutter analyze
          flutter test

  # ---------------------------------------------------------------------------
  # 1. macOS (Apple Silicon M-series arm64 only) -> .dmg
  # ---------------------------------------------------------------------------
  build-macos-arm64:
    name: Build macOS (Apple Silicon arm64 DMG)
    needs: verify
    runs-on: macos-latest # Apple Silicon (M-series arm64) runner
    env:
      RAW_VERSION: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Apple Silicon runner architecture
        run: |
          ARCH=$(uname -m)
          echo "Runner architecture: ${ARCH}"
          if [ "${ARCH}" != "arm64" ]; then
            echo "Expected Apple Silicon arm64 runner, got ${ARCH}"
            exit 1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS desktop & install dependencies
        run: |
          flutter config --enable-macos-desktop
          flutter pub get

      - name: Build macOS Release (arm64)
        run: flutter build macos --release

      - name: Package Apple Silicon .dmg
        run: |
          VERSION_CLEAN="${RAW_VERSION#v}"
          if [[ ! "${VERSION_CLEAN}" =~ ^[0-9] ]]; then
            VERSION_CLEAN="1.0.0"
          fi
          DMG_NAME="AppCleaner-${VERSION_CLEAN}-macos-arm64.dmg"

          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "${APP_PATH}" ]; then
            echo "Built .app bundle not found"
            exit 1
          fi
          echo "Found built app at: ${APP_PATH}"

          # Apply ad-hoc signature for Apple Silicon Gatekeeper compatibility
          codesign --force --deep --sign - "${APP_PATH}"

          mkdir -p dmg_staging
          cp -R "${APP_PATH}" "dmg_staging/AppCleaner.app"
          ln -s /Applications dmg_staging/Applications

          hdiutil create \
            -volname "AppCleaner" \
            -srcfolder dmg_staging \
            -ov \
            -format UDZO \
            "${DMG_NAME}"

          mkdir -p dist
          mv "${DMG_NAME}" dist/

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: dist/*.dmg

  # ---------------------------------------------------------------------------
  # 2. Linux (64-bit amd64 only) -> .deb
  # ---------------------------------------------------------------------------
  build-linux-amd64:
    name: Build Linux (64-bit amd64 DEB)
    needs: verify
    runs-on: ubuntu-latest
    env:
      RAW_VERSION: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GTK & packaging dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            dpkg-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop & install dependencies
        run: |
          flutter config --enable-linux-desktop
          flutter pub get

      - name: Build Linux Release (x64)
        run: flutter build linux --release --target-platform linux-x64

      - name: Package Debian .deb (amd64)
        run: |
          VERSION_CLEAN="${RAW_VERSION#v}"
          if [[ ! "${VERSION_CLEAN}" =~ ^[0-9] ]]; then
            VERSION_CLEAN="1.0.0"
          fi
          DEB_NAME="AppCleaner-${VERSION_CLEAN}-linux-amd64.deb"

          PKG_ROOT="deb_pkg"
          mkdir -p "${PKG_ROOT}/DEBIAN"
          mkdir -p "${PKG_ROOT}/opt/app_cleaner"
          mkdir -p "${PKG_ROOT}/usr/bin"
          mkdir -p "${PKG_ROOT}/usr/share/applications"

          cp -r build/linux/x64/release/bundle/* "${PKG_ROOT}/opt/app_cleaner/"
          chmod +x "${PKG_ROOT}/opt/app_cleaner/app_cleaner"

          ln -s /opt/app_cleaner/app_cleaner "${PKG_ROOT}/usr/bin/app_cleaner"

          cat <<EOF > "${PKG_ROOT}/DEBIAN/control"
          Package: app-cleaner
          Version: ${VERSION_CLEAN}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, policykit-1
          Maintainer: AppCleaner Contributors
          Description: Cross-platform application uninstaller, Android-style data resetter, and leftover cleaner.
          EOF

          cat <<EOF > "${PKG_ROOT}/usr/share/applications/app_cleaner.desktop"
          [Desktop Entry]
          Name=AppCleaner
          Comment=Uninstall apps, clear app data/cache, and clean orphaned leftovers
          Exec=/opt/app_cleaner/app_cleaner
          Icon=utilities-system-monitor
          Terminal=false
          Type=Application
          Categories=System;Utility;
          StartupWMClass=com.example.app_cleaner
          EOF

          chmod -R 755 "${PKG_ROOT}/DEBIAN"
          dpkg-deb --build --root-owner-group "${PKG_ROOT}" "${DEB_NAME}"

          mkdir -p dist
          mv "${DEB_NAME}" dist/

      - name: Upload Linux DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-deb
          path: dist/*.deb

  # ---------------------------------------------------------------------------
  # 3. Windows (64-bit x64 only) -> .exe
  # ---------------------------------------------------------------------------
  build-windows-x64:
    name: Build Windows (64-bit x64 EXE)
    needs: verify
    runs-on: windows-latest
    env:
      RAW_VERSION: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop & install dependencies
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Build Windows Release (x64)
        run: flutter build windows --release

      - name: Compile 64-bit Windows Installer (.exe) with Inno Setup
        shell: pwsh
        run: |
          $rawVer = "${env:RAW_VERSION}"
          if ([string]::IsNullOrWhiteSpace($rawVer)) { $rawVer = "1.0.0" }
          $verClean = $rawVer.TrimStart('v')
          if ($verClean -notmatch '^[0-9]') { $verClean = "1.0.0" }

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $cmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($cmd) {
              $iscc = $cmd.Source
            } else {
              choco install innosetup -y --no-progress
            }
          }

          $outBaseName = "AppCleaner-$verClean-windows-x64-setup"
          & $iscc `
            "/DMyAppVersion=$verClean" `
            "/DOutputFileName=$outBaseName" `
            "windows\installer.iss"

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Move-Item "build\installer\$outBaseName.exe" "dist\"

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-exe
          path: dist/*.exe

  # ---------------------------------------------------------------------------
  # 4. Publish GitHub Release (when triggered by tag v* or workflow_dispatch tag)
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs:
      - build-macos-arm64
      - build-linux-amd64
      - build-windows-x64
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    steps:
      - name: Download all built desktop packages
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: List release assets
        run: ls -lh release_assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
          name: AppCleaner ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release_assets/*.dmg
            release_assets/*.deb
            release_assets/*.exe
