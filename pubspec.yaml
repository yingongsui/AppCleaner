name: app_cleaner
description: "Cross-platform application uninstaller, Android-style data resetter, and leftover cleaner for macOS, Linux, and Windows."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/app_icon_transparent.png
    - assets/app_icon.svg
    - assets/app_icon_transparent.svg
